<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TIERRA — Coming Soon</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <section class="hero" id="hero">

    <!-- 5 image panels -->
    <div class="panel panel--1">
      <img src="images/01-Laguna.png" alt="" />
    </div>
    <div class="panel panel--2">
      <img src="images/02-Arena.png" alt="" />
    </div>
    <div class="panel panel--3">
      <img src="images/03-Monte.png" alt="" />
    </div>
    <div class="panel panel--4">
      <img src="images/04-Sierra.png" alt="" />
    </div>
    <div class="panel panel--5">
      <img src="images/05-Roca.png" alt="" />
    </div>

    <!-- Gradient overlay -->
    <div class="overlay"></div>

    <!-- Center content: logo + coming soon -->
    <div class="content" id="content">
      <img src="images/logo-tierra-subtitle.png" alt="Tierra" class="content__logo" />
      <p class="content__coming-soon">Coming Soon</p>
    </div>

  </section>

  <script>
    // Trigger panel animation after a short delay (mirrors React setTimeout 120ms)
    setTimeout(function () {
      document.getElementById('hero').classList.add('hero--animated');
    }, 120);

    // Fade in logo + text after 2 seconds (mirrors React setTimeout 2000ms)
    setTimeout(function () {
      document.getElementById('content').classList.add('content--visible');
    }, 2000);
  </script>

</body>
</html>
